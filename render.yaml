services:
  - type: web
    name: zahidsmm
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIL_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DIL_API_URL
        value: https://dilsmmpanel.com/api/v2
